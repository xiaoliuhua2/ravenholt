name: build-sandbox-image

# 目的：在 CI 里构建「一体化沙箱镜像」并推送到 GHCR —— 用户侧直接 docker pull，
#       免去本地 5 GB 构建（Ghidra 约 1.5 GB 下载 + Docker Hub / GHCR 拉取基础镜像）。
#
# 用户侧用法：
#   docker pull ghcr.io/<你的用户名>/ravenholt-sandbox:latest
#   docker tag  ghcr.io/<你的用户名>/ravenholt-sandbox:latest sandbox-runtime:latest
#   （或在 .ravenholt/config.json 的 sandbox.image 里直接填该镜像全名）
#
# 首次推送后请到 GitHub → 你的仓库 → Packages → ravenholt-sandbox → Package settings
# → Change visibility → Public；否则别人拉取需要登录 GHCR。
on:
  workflow_dispatch:
    inputs:
      strix_sandbox_image:
        description: "基础镜像（上游 strix 沙箱）"
        required: false
        default: "ghcr.io/usestrix/strix-sandbox:1.3.0"
      push:
        description: "推送到 GHCR？填 false 则只构建验证、不推送"
        required: false
        default: "true"

permissions:
  contents: read
  packages: write

jobs:
  build-sandbox-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: ${{ github.event.inputs.push != 'false' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (and push) sandbox image
        uses: docker/build-push-action@v6
        with:
          context: sandbox
          file: sandbox/Dockerfile
          build-args: |
            STRIX_SANDBOX_IMAGE=${{ github.event.inputs.strix_sandbox_image }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/ravenholt-sandbox:latest
            ghcr.io/${{ github.repository_owner }}/ravenholt-sandbox:${{ github.sha }}
          push: ${{ github.event.inputs.push != 'false' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
