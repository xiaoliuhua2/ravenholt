[pytest]
# ravenholt 引擎回归测试：上游 strix 测试套件的平移副本（见 tests/README.md）
#
# import 根 = 项目根，与 scripts/verify_*.py 的做法一致：
#   from strix.xxx  -> ravenholt/strix/（本仓库 vendored 的引擎包）
#   from agents     -> openai-agents SDK（第三方依赖）
#
# 注意：切勿把 strix/ 自身加进 pythonpath —— strix/ 下存在同名 agents/ 目录，
# 会遮蔽第三方 openai-agents 的 agents 包，导致整套测试崩坏。
asyncio_mode = auto
pythonpath = .
testpaths = tests
