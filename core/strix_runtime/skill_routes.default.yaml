  - id: dependency-confusion
    note: 依赖混淆
    signals: [依赖混淆, dependency confusion, 私有包, npm 投毒]
    skills: [src_hunt/dependency-confusion-test]
  - id: type-juggling
    note: 类型混淆
    signals: [类型混淆, type juggling, 弱比较, 0e 绕过]
    skills: [src_hunt/type-juggling-test]
  - id: xslt
    note: XSLT 注入
